name: autotest

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  mac:
    # macos-14 no longer resolves to a usable runner configuration for this org, so the mac lanes
    # follow tgfx and pin the macOS 15 image.
    name: mac (opengl-swiftshader)
    runs-on: macos-15
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Get Third-Party Cache
        id: third-party-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party
            test/baseline/.cache/opengl-swiftshader
          key: third-party-autotest-opengl-swiftshader-${{ hashFiles('DEPS') }}-${{ hashFiles('vendor.json') }}-${{ hashFiles('test/baseline/version.json') }}
          restore-keys: third-party-autotest-opengl-swiftshader-

      - uses: tecolicom/actions-use-homebrew-tools@v1
        with:
          tools: ninja yasm gcovr

      - name: Run depsync
        run: |
          npm install depsync -g
          depsync
        shell: bash

      - name: Get Puppeteer Cache
        id: puppeteer-cache
        uses: actions/cache@v4
        with:
          path: |
            test/node_modules
            ~/.cache/puppeteer
          key: puppeteer-autotest-mac-${{ hashFiles('test/package-lock.json') }}
          restore-keys: puppeteer-autotest-mac-

      - name: Install Puppeteer
        run: |
          cd test
          npm ci
        shell: bash

      - name: Test PPT Evaluator
        run: |
          npm ci --prefix tools/ppt-eval
          npm test --prefix tools/ppt-eval
        shell: bash

      - name: Check Code Format
        run: |
          chmod +x codeformat.sh
          ./codeformat.sh
        shell: bash

      - name: Run Autotest
        run: |
          mkdir -p third_party/tgfx/out/cache
          chmod +x autotest.sh
          ./autotest.sh USE_OPENGL_SWIFTSHADER --skip-images

      - name: Run Codecov
        run: |
          chmod +x codecov.sh
          ./codecov.sh

      - name: Upload Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: result/coverage.xml
          version: 'v0.7.3'

      - name: Save Third-Party Cache
        if: ${{ (github.event_name == 'push') && (steps.third-party-cache.outputs.cache-hit != 'true') }}
        uses: actions/cache/save@v4
        with:
          path: |
            third_party
            test/baseline/.cache/opengl-swiftshader
          key: third-party-autotest-opengl-swiftshader-${{ hashFiles('DEPS') }}-${{ hashFiles('vendor.json') }}-${{ hashFiles('test/baseline/version.json') }}

      - name: Job Failed
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: result

      - uses: actions/upload-artifact@v4
        with:
          name: result
          path: result

  mac_metal:
    name: mac(metal)
    # Run the full native Metal suite against its own baseline cache, including screenshot tests.
    runs-on: macos-15
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Get Third-Party Cache
        id: third-party-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party
            test/baseline/.cache/metal
          key: third-party-autotest-metal-${{ hashFiles('DEPS') }}-${{ hashFiles('vendor.json') }}-${{ hashFiles('test/baseline/version.json') }}
          restore-keys: third-party-autotest-metal-

      - uses: tecolicom/actions-use-homebrew-tools@v1
        with:
          tools: ninja yasm

      - name: Run depsync
        run: |
          npm install depsync -g
          depsync
        shell: bash

      - name: Get Puppeteer Cache
        uses: actions/cache@v4
        with:
          path: |
            test/node_modules
            ~/.cache/puppeteer
          key: puppeteer-autotest-mac-${{ hashFiles('test/package-lock.json') }}
          restore-keys: puppeteer-autotest-mac-

      - name: Install Puppeteer
        run: npm ci --prefix test
        shell: bash

      - name: Run macOS Metal Autotest
        id: metal_autotest
        run: |
          touch "$RUNNER_TEMP/metal-autotest-start"
          mkdir -p third_party/tgfx/out/cache
          chmod +x autotest.sh
          ./autotest.sh USE_METAL --skip-images
        shell: bash

      - name: Collect Metal Crash Diagnostics
        if: ${{ failure() && steps.metal_autotest.outcome == 'failure' }}
        timeout-minutes: 5
        run: |
          CRASH_DIR="$GITHUB_WORKSPACE/result/crash"
          mkdir -p "$CRASH_DIR"
          git rev-parse HEAD > "$CRASH_DIR/commit.txt"
          shopt -s nullglob
          for ((WAITED=0; WAITED<30; WAITED+=5)); do
            sleep 5
            for REPORT_DIR in "$HOME/Library/Logs/DiagnosticReports" "/Library/Logs/DiagnosticReports"; do
              if [ -d "$REPORT_DIR" ] && [ -f "$RUNNER_TEMP/metal-autotest-start" ]; then
                find "$REPORT_DIR" -type f -newer "$RUNNER_TEMP/metal-autotest-start" \
                  \( -name 'PAGFullTest_Metal*.ips' -o -name 'PAGFullTest_Metal*.crash' \) \
                  -exec cp -p {} "$CRASH_DIR/" \; || \
                  echo "::warning::Could not collect all Metal crash reports from $REPORT_DIR."
              fi
            done
            REPORTS=("$CRASH_DIR/"*.ips "$CRASH_DIR/"*.crash)
            if [ "${#REPORTS[@]}" -ne 0 ]; then
              break
            fi
          done
          if [ "${#REPORTS[@]}" -eq 0 ]; then
            echo "::warning::No PAGFullTest_Metal crash report was found within 30 seconds."
          fi
          BINARY="$GITHUB_WORKSPACE/build/PAGFullTest_Metal"
          if [ -f "$BINARY" ]; then
            cp -p "$BINARY" "$CRASH_DIR/" || \
              echo "::warning::Could not copy the Metal test executable."
            xcrun dwarfdump --uuid "$BINARY" > "$CRASH_DIR/binary-uuid.txt" 2>&1 || \
              echo "::warning::Could not read the Metal test executable UUID."
            xcrun dsymutil "$BINARY" -o "$CRASH_DIR/PAGFullTest_Metal.dSYM" \
              > "$CRASH_DIR/dsymutil.log" 2>&1 || \
              echo "::warning::Could not generate Metal test debug symbols. See dsymutil.log."
          else
            echo "::warning::The Metal test executable is unavailable."
          fi
        shell: bash

      - name: Save Third-Party Cache
        if: ${{ (github.event_name == 'push') && (steps.third-party-cache.outputs.cache-hit != 'true') }}
        uses: actions/cache/save@v4
        with:
          path: |
            third_party
            test/baseline/.cache/metal
          key: third-party-autotest-metal-${{ hashFiles('DEPS') }}-${{ hashFiles('vendor.json') }}-${{ hashFiles('test/baseline/version.json') }}

      - name: Upload Metal Test Results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mac_metal_result
          path: result
          include-hidden-files: true
