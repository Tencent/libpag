name: autotest

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  mac:
    # macos-14 no longer resolves to a usable runner configuration for this org, so the mac lanes
    # follow tgfx and pin the macOS 15 image.
    name: mac (opengl-swiftshader)
    runs-on: macos-15
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Get Third-Party Cache
        id: third-party-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party
            test/baseline/.cache/opengl-swiftshader
          key: third-party-autotest-opengl-swiftshader-${{ hashFiles('DEPS') }}-${{ hashFiles('vendor.json') }}-${{ hashFiles('test/baseline/version.json') }}
          restore-keys: third-party-autotest-opengl-swiftshader-

      - uses: tecolicom/actions-use-homebrew-tools@v1
        with:
          tools: ninja yasm gcovr

      - name: Run depsync
        run: |
          npm install depsync -g
          depsync
        shell: bash

      - name: Get Puppeteer Cache
        id: puppeteer-cache
        uses: actions/cache@v4
        with:
          path: |
            test/node_modules
            ~/.cache/puppeteer
          key: puppeteer-autotest-mac-${{ hashFiles('test/package-lock.json') }}
          restore-keys: puppeteer-autotest-mac-

      - name: Install Puppeteer
        run: |
          cd test
          npm ci
        shell: bash

      - name: Test PPT Evaluator
        run: |
          npm ci --prefix tools/ppt-eval
          npm test --prefix tools/ppt-eval
        shell: bash

      - name: Check Code Format
        run: |
          chmod +x codeformat.sh
          ./codeformat.sh
        shell: bash

      - name: Run Autotest
        run: |
          mkdir -p third_party/tgfx/out/cache
          chmod +x autotest.sh
          ./autotest.sh USE_OPENGL_SWIFTSHADER --skip-images

      - name: Run Codecov
        run: |
          chmod +x codecov.sh
          ./codecov.sh

      - name: Upload Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: result/coverage.xml
          version: 'v0.7.3'

      - name: Save Third-Party Cache
        if: ${{ (github.event_name == 'push') && (steps.third-party-cache.outputs.cache-hit != 'true') }}
        uses: actions/cache/save@v4
        with:
          path: |
            third_party
            test/baseline/.cache/opengl-swiftshader
          key: third-party-autotest-opengl-swiftshader-${{ hashFiles('DEPS') }}-${{ hashFiles('vendor.json') }}-${{ hashFiles('test/baseline/version.json') }}

      - name: Job Failed
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: result

      - uses: actions/upload-artifact@v4
        with:
          name: result
          path: result

  mac_metal:
    name: mac(metal)
    # Run the full native Metal suite against its own baseline cache, including screenshot tests.
    runs-on: macos-15
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          lfs: true

      - name: Get Third-Party Cache
        id: third-party-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party
            test/baseline/.cache/metal
          key: third-party-autotest-metal-${{ hashFiles('DEPS') }}-${{ hashFiles('vendor.json') }}-${{ hashFiles('test/baseline/version.json') }}
          restore-keys: third-party-autotest-metal-

      - uses: tecolicom/actions-use-homebrew-tools@v1
        with:
          tools: ninja yasm

      - name: Run depsync
        run: |
          npm install depsync -g
          depsync
        shell: bash

      - name: Get Puppeteer Cache
        uses: actions/cache@v4
        with:
          path: |
            test/node_modules
            ~/.cache/puppeteer
          key: puppeteer-autotest-mac-${{ hashFiles('test/package-lock.json') }}
          restore-keys: puppeteer-autotest-mac-

      - name: Install Puppeteer
        run: npm ci --prefix test
        shell: bash

      - name: Build PR Metal Tests
        if: ${{ github.event_name == 'pull_request' }}
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          mkdir -p result third_party/tgfx/out/cache
          git rev-parse HEAD | tee result/tested-commit.txt
          ./install_tools.sh
          cmake -S . -B build-pr-metal \
            -DPAG_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug \
            -DPAG_USE_METAL=ON -DPAG_USE_OPENGL=OFF -DPAG_USE_SWIFTSHADER=OFF \
            -DPAG_SKIP_BASELINE_CHECK=ON -DPAG_SKIP_GENERATE_BASELINE_IMAGES=ON \
            -DCMAKE_CXX_FLAGS="-fprofile-arcs -ftest-coverage -g -O0"
          cmake --build build-pr-metal \
            --target UpdateBaseline_Metal PAGFullTest_Metal --parallel 12
        shell: bash

      - name: Generate PR-local Metal Reference Hashes
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          echo "References are generated from this PR; this is not a historical image comparison."
          rm -f test/baseline/.cache/metal/md5.json
          ./build-pr-metal/UpdateBaseline_Metal \
            --gtest_output="json:$GITHUB_WORKSPACE/result/UpdateBaseline_Metal.json"
          test -s test/baseline/.cache/metal/md5.json
          test -s test/baseline/.cache/metal/HEAD
          cmp -s test/baseline/version.json test/baseline/.cache/metal/version.json
        shell: bash

      - name: Run PR Metal Full Tests
        if: ${{ github.event_name == 'pull_request' }}
        working-directory: build-pr-metal
        run: |
          set -euo pipefail
          ./PAGFullTest_Metal \
            --gtest_output="json:$GITHUB_WORKSPACE/result/PAGFullTest_Metal.json"
        shell: bash

      - name: Run macOS Metal Autotest
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          mkdir -p third_party/tgfx/out/cache
          chmod +x autotest.sh
          ./autotest.sh USE_METAL --skip-images
        shell: bash

      - name: Save Third-Party Cache
        if: ${{ (github.event_name == 'push') && (steps.third-party-cache.outputs.cache-hit != 'true') }}
        uses: actions/cache/save@v4
        with:
          path: |
            third_party
            test/baseline/.cache/metal
          key: third-party-autotest-metal-${{ hashFiles('DEPS') }}-${{ hashFiles('vendor.json') }}-${{ hashFiles('test/baseline/version.json') }}

      - name: Upload Metal Test Results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mac_metal_result
          path: |
            result
            test/out
          include-hidden-files: true
