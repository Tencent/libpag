<svg width="50" height="50" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g filter="url(#noise)">
    <rect width="50" height="50" fill="#D9D9D9"/>
  </g>
  <defs>
    <filter id="noise" x="0" y="0" width="50" height="50" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.6666667" numOctaves="3" seed="2488" result="noise"/>
      <feComponentTransfer in="noise" result="coloredNoise">
        <feFuncR type="linear" slope="2" intercept="-0.5"/>
        <feFuncG type="linear" slope="2" intercept="-0.5"/>
        <feFuncB type="linear" slope="2" intercept="-0.5"/>
        <feFuncA type="discrete" tableValues="1 1 0 0"/>
      </feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic" result="noiseClipped"/>
      <feComponentTransfer in="noiseClipped" result="color">
        <feFuncA type="table" tableValues="0 0.29"/>
      </feComponentTransfer>
      <feMerge result="effect1_noise">
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="color"/>
      </feMerge>
    </filter>
  </defs>
</svg>
