<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <filter id="f">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="5" dy="5">
        <animate attributeName="dy" from="5" to="20" dur="1s" fill="freeze"/>
      </feOffset>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="50" height="50" fill="red" fill-opacity="1">
    <animate attributeName="fill-opacity" values="1;0.2" dur="1s" fill="freeze"/>
  </rect>
  <rect x="10" y="10" width="60" height="40" fill="none" stroke="red" stroke-width="4">
    <animate attributeName="stroke" values="red;blue" dur="1s" fill="freeze"/>
  </rect>
  <rect x="10" y="10" width="60" height="40" fill="none" stroke="green" stroke-width="4"
        stroke-opacity="1">
    <animate attributeName="stroke-opacity" values="1;0.25" dur="1s" fill="freeze"/>
  </rect>
  <path d="M10,10 L80,10 L80,80" fill="none" stroke="red" stroke-width="6" stroke-miterlimit="4">
    <animate attributeName="stroke-miterlimit" values="4;10" dur="1s" fill="freeze"/>
  </path>
  <rect width="50" height="50" fill="red" visibility="visible">
    <animate attributeName="visibility" values="visible;hidden" dur="1s" fill="freeze"/>
  </rect>
  <rect width="50" height="50" fill="red" filter="url(#f)"/>
</svg>
