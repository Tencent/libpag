<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <g id="pop" transform="translate(10,20)">
    <rect width="10" height="10" fill="red"/>
    <animateTransform attributeName="transform" type="scale" values="0;1;2" keyTimes="0;0.5;1"
                      dur="1s" additive="sum" fill="freeze"/>
  </g>
  <ellipse cx="10" cy="20" rx="5" ry="6" fill="blue">
    <animate attributeName="cx" values="10;30" dur="1s" fill="freeze"/>
    <animate attributeName="cy" values="20;40" dur="1s" fill="freeze"/>
  </ellipse>
</svg>
