<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <g transform="translate(60 60)">
    <rect x="-25" y="-25" width="50" height="50" rx="8" fill="#6366f1">
      <animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.5s" begin="0s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" values="0;1.2;1" keyTimes="0;0.7;1" dur="0.5s" begin="0s" calcMode="spline" keySplines="0.34 1.56 0.64 1" fill="freeze"/>
    </rect>
  </g>
  <g transform="translate(60 60)">
    <rect x="-25" y="-25" width="50" height="50" rx="8" fill="none" stroke="#6366f1" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" keyTimes="0;0.5;1" dur="0.8s" begin="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" values="1;1.5" keyTimes="0;1" dur="0.8s" begin="0.5s" fill="freeze"/>
    </rect>
  </g>
</svg>
