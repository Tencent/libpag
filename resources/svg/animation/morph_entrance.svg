<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <rect x="35" y="35" width="50" height="50" rx="8" fill="#3b82f6" opacity="0.5">
    <animate attributeName="opacity" from="0.5" to="1" dur="1s" begin="0s" fill="freeze"/>
    <animate attributeName="width" from="50" to="70" dur="1s" begin="0s" fill="freeze"/>
    <animate attributeName="height" from="50" to="70" dur="1s" begin="0s" fill="freeze"/>
    <animate attributeName="x" from="35" to="25" dur="1s" begin="0s" fill="freeze"/>
    <animate attributeName="y" from="35" to="25" dur="1s" begin="0s" fill="freeze"/>
    <animate attributeName="fill" from="#3b82f6" to="#ec4899" dur="1s" begin="0s" fill="freeze"/>
  </rect>
</svg>
