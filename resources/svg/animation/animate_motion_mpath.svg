<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <path id="motionPath" d="M0,0 L50,50"/>
  </defs>
  <rect id="r" width="20" height="20" fill="red">
    <animateMotion dur="1s" fill="freeze">
      <mpath href="#motionPath"/>
    </animateMotion>
  </rect>
</svg>
