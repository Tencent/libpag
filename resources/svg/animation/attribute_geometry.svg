<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <rect x="10" y="20" width="30" height="10" fill="red">
    <animate attributeName="x" values="10;40" dur="1s" fill="freeze"/>
  </rect>
  <rect x="10" y="20" width="30" height="10" fill="green">
    <animate attributeName="y" values="20;50" dur="1s" fill="freeze"/>
  </rect>
  <rect x="10" y="20" width="30" height="0" fill="blue">
    <animate attributeName="height" values="0;40" dur="1s" fill="freeze"/>
  </rect>
  <circle cx="50" cy="50" r="5" fill="orange">
    <animate attributeName="r" values="5;20" dur="1s" fill="freeze"/>
  </circle>
  <ellipse cx="60" cy="60" rx="20" ry="10" fill="purple">
    <animate attributeName="ry" values="10;30" dur="1s" fill="freeze"/>
  </ellipse>
</svg>
