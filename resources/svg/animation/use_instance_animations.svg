<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <rect id="tile" width="20" height="20" fill="red">
      <animate attributeName="opacity" values="1;0.2" dur="1s" fill="freeze"/>
    </rect>
  </defs>
  <use href="#tile" x="10" y="10"/>
  <use href="#tile" x="50" y="50"/>
</svg>
