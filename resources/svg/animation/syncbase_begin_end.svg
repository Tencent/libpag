<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <rect width="50" height="50" fill="red">
    <animate id="first" attributeName="opacity" values="1;0.3" dur="2s" fill="freeze"/>
    <animate attributeName="fill" values="#FF0000;#0000FF" begin="first.end" dur="1s" fill="freeze"/>
  </rect>
</svg>
