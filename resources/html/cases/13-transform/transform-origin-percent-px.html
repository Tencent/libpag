<!DOCTYPE html>
<html>
  <head><title>transform-origin percent / px</title></head>
  <body style="width: 240px; height: 120px; display: flex; gap: 12px; padding: 16px;
               box-sizing: border-box; overflow: hidden; background-color: #E2E8F0;">
    <div style="width: 90px; height: 70px; background-color: #6366F1;
                transform: rotate(18deg); transform-origin: 25% 75%;"></div>
    <div style="width: 90px; height: 70px; background-color: #22C55E;
                transform: rotate(-18deg); transform-origin: 10px 40px;"></div>
  </body>
</html>
