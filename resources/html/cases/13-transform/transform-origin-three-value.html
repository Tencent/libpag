<!DOCTYPE html>
<html>
  <head><title>transform-origin three value</title></head>
  <body style="width: 240px; height: 140px; display: flex; align-items: center;
               justify-content: center; overflow: hidden; background-color: #E2E8F0;">
    <!-- The third value is the pivot depth, kept as `anchorZ`. -->
    <div style="width: 110px; height: 70px; background-color: #6366F1;
                transform: perspective(600px) rotateX(-35deg);
                transform-origin: 0px 70px 30px;"></div>
  </body>
</html>
