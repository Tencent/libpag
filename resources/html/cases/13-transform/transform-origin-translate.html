<!DOCTYPE html>
<html>
  <head><title>transform-origin with a pure translation</title></head>
  <body style="width: 240px; height: 120px; display: flex; align-items: center;
               justify-content: center; overflow: hidden; background-color: #E2E8F0;">
    <!-- A pure translation does not depend on the pivot, so no anchor is emitted. -->
    <div style="width: 90px; height: 70px; background-color: #6366F1;
                transform: translate(18px, -8px); transform-origin: bottom right;"></div>
  </body>
</html>
