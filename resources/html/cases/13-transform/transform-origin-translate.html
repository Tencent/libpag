<!DOCTYPE html>
<html>
  <head><title>transform-origin with pure translation</title></head>
  <body style="width: 200px; height: 140px; display: flex; align-items: center; justify-content: center; overflow: hidden; background-color: #E2E8F0;">
    <div style="width: 90px; height: 60px; background-color: #6366F1; transform: translate(12px, 6px); transform-origin: 10px 8px;"></div>
  </body>
</html>
