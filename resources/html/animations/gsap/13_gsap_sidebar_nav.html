<!DOCTYPE html>
<html>
  <head>
    <title>GSAP Sidebar Navigation Reveal</title>
  </head>
  <body style="width: 800px; height: 600px; background-color: #F8FAFC; font-family: Arial;">
    <div style="display: flex; flex-direction: row; width: 100%; height: 100%;">

      <div style="display: flex; flex-direction: column; gap: 10px; width: 260px; height: 100%; padding: 32px 20px; background-color: #0F172A;">
        <div id="brand" style="display: flex; flex-direction: row; align-items: center; gap: 12px; padding: 8px 12px; opacity: 0;">
          <div style="width: 36px; height: 36px; border-radius: 10px; background-image: linear-gradient(135deg, #818CF8, #C084FC);"></div>
          <p style="font-size: 18px; font-weight: bold; color: #F8FAFC;">Nebula</p>
        </div>

        <div style="height: 16px;"></div>

        <div class="nav-item" style="display: flex; flex-direction: row; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; background-color: #1E293B; opacity: 0;">
          <div style="width: 18px; height: 18px; border-radius: 6px; background-color: #818CF8;"></div>
          <p style="font-size: 15px; font-weight: bold; color: #E2E8F0;">Dashboard</p>
        </div>
        <div class="nav-item" style="display: flex; flex-direction: row; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; opacity: 0;">
          <div style="width: 18px; height: 18px; border-radius: 6px; background-color: #475569;"></div>
          <p style="font-size: 15px; color: #94A3B8;">Projects</p>
        </div>
        <div class="nav-item" style="display: flex; flex-direction: row; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; opacity: 0;">
          <div style="width: 18px; height: 18px; border-radius: 6px; background-color: #475569;"></div>
          <p style="font-size: 15px; color: #94A3B8;">Analytics</p>
        </div>
        <div class="nav-item" style="display: flex; flex-direction: row; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; opacity: 0;">
          <div style="width: 18px; height: 18px; border-radius: 6px; background-color: #475569;"></div>
          <p style="font-size: 15px; color: #94A3B8;">Messages</p>
        </div>
        <div class="nav-item" style="display: flex; flex-direction: row; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; opacity: 0;">
          <div style="width: 18px; height: 18px; border-radius: 6px; background-color: #475569;"></div>
          <p style="font-size: 15px; color: #94A3B8;">Settings</p>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; flex: 1; height: 100%; padding: 40px;">
        <div id="pulse" style="width: 90px; height: 90px; border-radius: 28px; background-image: linear-gradient(135deg, #6366F1, #EC4899); box-shadow: 0 18px 40px #6366F140;"></div>
        <p id="welcome" style="font-size: 22px; font-weight: bold; color: #0F172A; opacity: 0;">Welcome back, Sam</p>
        <p id="hint" style="font-size: 14px; color: #64748B; opacity: 0;">Your workspace is ready.</p>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
      const tl = gsap.timeline({ defaults: { ease: 'power3.out', duration: 0.6 } });
      tl.fromTo('#brand', { opacity: 0, x: -30 }, { opacity: 1, x: 0 })
        .fromTo('.nav-item', { opacity: 0, x: -30 }, { opacity: 1, x: 0, stagger: 0.12 }, '-=0.2')
        .fromTo('#welcome', { opacity: 0, y: 20 }, { opacity: 1, y: 0 }, '-=0.2')
        .fromTo('#hint', { opacity: 0, y: 20 }, { opacity: 1, y: 0 }, '-=0.4');

      gsap.to('#pulse', {
        y: -16,
        duration: 1.4,
        ease: 'sine.inOut',
        repeat: -1,
        yoyo: true
      });
    </script>
  </body>
</html>
