<!DOCTYPE html>
<html>
  <head>
    <title>GSAP Vertical Timeline</title>
  </head>
  <body style="width: 800px; height: 600px; background-color: #FFFBEB; font-family: Arial;">
    <div style="display: flex; flex-direction: row; gap: 36px; width: 100%; height: 100%; padding: 48px;">

      <!-- vertical writing-mode title strip -->
      <div style="display: flex; align-items: center; justify-content: center; width: 96px; border-radius: 20px; background-image: linear-gradient(180deg, #F59E0B, #B45309);">
        <p id="vtitle" style="writing-mode: vertical-rl; font-size: 34px; font-weight: bold; letter-spacing: 8px; color: #FFFFFF; opacity: 0;">JOURNEY</p>
      </div>

      <div style="display: flex; flex-direction: column; justify-content: center; gap: 22px; flex: 1;">
        <div class="item" style="display: flex; flex-direction: row; align-items: center; gap: 18px; opacity: 0;">
          <div class="bullet" style="width: 22px; height: 22px; border-radius: 11px; background-color: #F59E0B;"></div>
          <div style="display: flex; flex-direction: column; gap: 4px; flex: 1; padding: 16px 20px; border-radius: 14px; background-color: #FFFFFF; box-shadow: 0 6px 18px #B4530914;">
            <p style="font-size: 16px; font-weight: bold; color: #78350F;">2019 · Founded</p>
            <p style="font-size: 13px; color: #92400E;">Started in a tiny garage studio.</p>
          </div>
        </div>

        <div class="item" style="display: flex; flex-direction: row; align-items: center; gap: 18px; opacity: 0;">
          <div class="bullet" style="width: 22px; height: 22px; border-radius: 11px; background-color: #F59E0B;"></div>
          <div style="display: flex; flex-direction: column; gap: 4px; flex: 1; padding: 16px 20px; border-radius: 14px; background-color: #FFFFFF; box-shadow: 0 6px 18px #B4530914;">
            <p style="font-size: 16px; font-weight: bold; color: #78350F;">2021 · First Million</p>
            <p style="font-size: 13px; color: #92400E;">Crossed a million active users.</p>
          </div>
        </div>

        <div class="item" style="display: flex; flex-direction: row; align-items: center; gap: 18px; opacity: 0;">
          <div class="bullet" style="width: 22px; height: 22px; border-radius: 11px; background-color: #F59E0B;"></div>
          <div style="display: flex; flex-direction: column; gap: 4px; flex: 1; padding: 16px 20px; border-radius: 14px; background-color: #FFFFFF; box-shadow: 0 6px 18px #B4530914;">
            <p style="font-size: 16px; font-weight: bold; color: #78350F;">2023 · Global</p>
            <p style="font-size: 13px; color: #92400E;">Expanded to 40+ countries.</p>
          </div>
        </div>

        <div class="item" style="display: flex; flex-direction: row; align-items: center; gap: 18px; opacity: 0;">
          <div class="bullet" style="width: 22px; height: 22px; border-radius: 11px; background-color: #F59E0B;"></div>
          <div style="display: flex; flex-direction: column; gap: 4px; flex: 1; padding: 16px 20px; border-radius: 14px; background-color: #FFFFFF; box-shadow: 0 6px 18px #B4530914;">
            <p style="font-size: 16px; font-weight: bold; color: #78350F;">2025 · Today</p>
            <p style="font-size: 13px; color: #92400E;">Building the next chapter.</p>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
      const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });
      tl.fromTo('#vtitle', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8 });

      tl.fromTo('.item',
        { opacity: 0, x: 50 },
        { opacity: 1, x: 0, duration: 0.6, stagger: 0.2 },
        '-=0.3'
      );

      // bullets pulse colour once revealed, looping gently
      gsap.to('.bullet', {
        backgroundColor: '#DC2626',
        duration: 0.9,
        stagger: 0.2,
        repeat: -1,
        yoyo: true,
        ease: 'sine.inOut',
        delay: 1.6
      });
    </script>
  </body>
</html>
