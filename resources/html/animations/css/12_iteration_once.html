<!DOCTYPE html>
<html>
  <head>
    <title>Iteration - finite once</title>
    <style>
      @keyframes introIn {
        0%   { opacity: 0; transform: translateY(-40px); }
        100% { opacity: 1; transform: translateY(0px); }
      }
    </style>
  </head>
  <body style="width: 300px; height: 140px; background-color: #082F49;">
    <div id="banner"
         style="position: absolute; left: 30px; top: 46px;
                width: 240px; height: 48px; border-radius: 10px;
                background-color: #0EA5E9;
                animation: introIn 0.8s ease-out 1;"></div>
  </body>
</html>
