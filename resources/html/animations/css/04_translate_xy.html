<!DOCTYPE html>
<html>
  <head>
    <title>Translate XY</title>
    <style>
      @keyframes diag {
        0%   { transform: translate(0px, 0px); }
        100% { transform: translate(140px, 90px); }
      }
    </style>
  </head>
  <body style="width: 240px; height: 180px; background-color: #3B0764;">
    <div id="mover"
         style="position: absolute; left: 16px; top: 16px;
                width: 56px; height: 56px; border-radius: 12px;
                background-color: #F0ABFC;
                animation: diag 2s linear infinite;"></div>
  </body>
</html>
