<!DOCTYPE html>
<html>
  <head>
    <title>Animated SVG Sky Scene</title>
    <style>
      /* Inline SVG artwork is passed through verbatim; the host
         Layers animate via translate / opacity channels only. */
      @keyframes sunGlow {
        0%   { opacity: 0.75; }
        50%  { opacity: 1; }
        100% { opacity: 0.75; }
      }
      @keyframes driftSlow {
        0%   { transform: translateX(0px); }
        100% { transform: translateX(60px); }
      }
      @keyframes driftFast {
        0%   { transform: translateX(0px); }
        100% { transform: translateX(90px); }
      }
      @keyframes twinkle {
        0%   { opacity: 0.2; }
        50%  { opacity: 1; }
        100% { opacity: 0.2; }
      }
    </style>
  </head>
  <body style="width: 520px; height: 380px; overflow: hidden;
               background-image: linear-gradient(180deg, #1E3A8A, #7C3AED 70%, #F472B6);">

    <div style="position: absolute; top: 50px; right: 70px; width: 120px; height: 120px;
                animation: sunGlow 3s ease-in-out infinite;">
      <svg width="120" height="120" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="30" fill="#FDE047"/>
        <circle cx="60" cy="60" r="42" fill="none" stroke="#FDE047" stroke-width="3" stroke-opacity="0.5"/>
        <g stroke="#FDE047" stroke-width="4" stroke-linecap="round">
          <line x1="60" y1="6" x2="60" y2="20"/>
          <line x1="60" y1="100" x2="60" y2="114"/>
          <line x1="6" y1="60" x2="20" y2="60"/>
          <line x1="100" y1="60" x2="114" y2="60"/>
          <line x1="22" y1="22" x2="32" y2="32"/>
          <line x1="88" y1="88" x2="98" y2="98"/>
          <line x1="98" y1="22" x2="88" y2="32"/>
          <line x1="32" y1="88" x2="22" y2="98"/>
        </g>
      </svg>
    </div>

    <div style="position: absolute; top: 120px; left: 40px; width: 160px; height: 70px;
                animation: driftSlow 6s ease-in-out infinite alternate;">
      <svg width="160" height="70" viewBox="0 0 160 70">
        <ellipse cx="55" cy="45" rx="45" ry="25" fill="#F8FAFC"/>
        <ellipse cx="100" cy="38" rx="38" ry="30" fill="#F8FAFC"/>
        <ellipse cx="130" cy="48" rx="28" ry="20" fill="#E2E8F0"/>
      </svg>
    </div>

    <div style="position: absolute; top: 210px; left: 230px; width: 130px; height: 60px;
                animation: driftFast 5s ease-in-out infinite alternate;">
      <svg width="130" height="60" viewBox="0 0 130 60">
        <ellipse cx="45" cy="38" rx="38" ry="22" fill="#E0E7FF"/>
        <ellipse cx="85" cy="32" rx="32" ry="26" fill="#E0E7FF"/>
      </svg>
    </div>

    <div style="position: absolute; top: 40px; left: 70px; width: 18px; height: 18px;
                animation: twinkle 2.4s ease-in-out infinite; animation-delay: 0s;">
      <svg width="18" height="18" viewBox="0 0 18 18">
        <path d="M9 0L11 7L18 9L11 11L9 18L7 11L0 9L7 7Z" fill="#FFFFFF"/>
      </svg>
    </div>
    <div style="position: absolute; top: 90px; left: 230px; width: 14px; height: 14px;
                animation: twinkle 2.4s ease-in-out infinite; animation-delay: 0.8s;">
      <svg width="14" height="14" viewBox="0 0 18 18">
        <path d="M9 0L11 7L18 9L11 11L9 18L7 11L0 9L7 7Z" fill="#FFFFFF"/>
      </svg>
    </div>
    <div style="position: absolute; top: 30px; left: 340px; width: 16px; height: 16px;
                animation: twinkle 2.4s ease-in-out infinite; animation-delay: 1.6s;">
      <svg width="16" height="16" viewBox="0 0 18 18">
        <path d="M9 0L11 7L18 9L11 11L9 18L7 11L0 9L7 7Z" fill="#FFFFFF"/>
      </svg>
    </div>
  </body>
</html>
