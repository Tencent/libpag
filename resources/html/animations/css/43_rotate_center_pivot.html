<!DOCTYPE html>
<html>
  <head>
    <title>Rotate Center Pivot</title>
    <style>
      @keyframes spin {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body style="width: 240px; height: 160px; background-color: #0F172A;">
    <div id="bar"
         style="position: absolute; left: 60px; top: 50px;
                width: 120px; height: 60px; border-radius: 8px;
                background-color: #38BDF8;
                animation: spin 2s linear infinite;">
      <div style="position: absolute; left: 96px; top: 18px;
                  width: 24px; height: 24px; border-radius: 12px;
                  background-color: #F472B6;"></div>
    </div>
  </body>
</html>
