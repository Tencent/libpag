<!DOCTYPE html>
<html>
  <head>
    <title>Rainy Weather Scene</title>
    <style>
      /* Inline SVG cloud + raindrops falling via translateY/opacity;
         a flash layer pulses its color to mimic lightning. */
      @keyframes cloudBob {
        0%   { transform: translateX(0px); }
        100% { transform: translateX(24px); }
      }
      @keyframes drop {
        0%   { transform: translateY(0px); opacity: 0; }
        20%  { opacity: 1; }
        100% { transform: translateY(150px); opacity: 0; }
      }
      @keyframes flash {
        0%   { background-color: #1E293B00; }
        92%  { background-color: #1E293B00; }
        96%  { background-color: #FDE047AA; }
        100% { background-color: #1E293B00; }
      }
      .raindrop {
        width: 4px; height: 16px; border-radius: 9999px;
        background-image: linear-gradient(180deg, #93C5FD, #3B82F6);
      }
    </style>
  </head>
  <body style="width: 480px; height: 360px; overflow: hidden;
               background-image: linear-gradient(180deg, #334155, #475569);">

    <div style="position: absolute; top: 0px; left: 0px; width: 480px; height: 360px;
                background-color: #1E293B00;
                animation: flash 4s ease-in-out infinite;"></div>

    <div style="position: absolute; top: 60px; left: 150px; width: 180px; height: 90px;
                animation: cloudBob 5s ease-in-out infinite alternate;">
      <svg width="180" height="90" viewBox="0 0 180 90">
        <ellipse cx="60" cy="58" rx="50" ry="30" fill="#E2E8F0"/>
        <ellipse cx="110" cy="48" rx="44" ry="36" fill="#F1F5F9"/>
        <ellipse cx="140" cy="60" rx="34" ry="26" fill="#CBD5E1"/>
      </svg>
    </div>

    <div class="raindrop" style="position: absolute; top: 160px; left: 175px;
                                 animation: drop 1.1s linear infinite; animation-delay: 0s;"></div>
    <div class="raindrop" style="position: absolute; top: 160px; left: 215px;
                                 animation: drop 1.1s linear infinite; animation-delay: 0.3s;"></div>
    <div class="raindrop" style="position: absolute; top: 160px; left: 255px;
                                 animation: drop 1.1s linear infinite; animation-delay: 0.6s;"></div>
    <div class="raindrop" style="position: absolute; top: 160px; left: 295px;
                                 animation: drop 1.1s linear infinite; animation-delay: 0.15s;"></div>
    <div class="raindrop" style="position: absolute; top: 160px; left: 195px;
                                 animation: drop 1.1s linear infinite; animation-delay: 0.75s;"></div>
    <div class="raindrop" style="position: absolute; top: 160px; left: 235px;
                                 animation: drop 1.1s linear infinite; animation-delay: 0.45s;"></div>
    <div class="raindrop" style="position: absolute; top: 160px; left: 275px;
                                 animation: drop 1.1s linear infinite; animation-delay: 0.9s;"></div>
  </body>
</html>
