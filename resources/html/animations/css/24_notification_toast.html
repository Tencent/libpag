<!DOCTYPE html>
<html>
  <head>
    <title>Notification Toast Slide-In</title>
    <style>
      /* GSAP-style overshoot ease (cubic-bezier) + opacity fade.
         translateX + opacity folded into one keyframes timeline. */
      @keyframes toastIn {
        0%   { opacity: 0; transform: translateX(120px); }
        60%  { opacity: 1; transform: translateX(-12px); }
        100% { opacity: 1; transform: translateX(0px); }
      }
      @keyframes iconPulse {
        0%   { background-color: #22C55E; }
        50%  { background-color: #16A34A; }
        100% { background-color: #22C55E; }
      }
    </style>
  </head>
  <body style="width: 520px; height: 220px; display: flex; flex-direction: column;
               align-items: center; justify-content: center;
               background-color: #0B1120; font-family: Arial;">
    <div style="display: flex; flex-direction: row; align-items: center; gap: 18px;
                width: 420px; padding: 20px; border-radius: 16px;
                background-image: linear-gradient(120deg, #FFFFFF, #F1F5F9);
                box-shadow: 0 18px 40px #0EA5E926;
                animation: toastIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) infinite;">
      <div style="display: flex; align-items: center; justify-content: center;
                  width: 48px; height: 48px; border-radius: 9999px;
                  background-color: #22C55E;
                  animation: iconPulse 1.8s ease-in-out infinite;">
        <svg width="26" height="26" viewBox="0 0 24 24">
          <path d="M20 6L9 17l-5-5" fill="none" stroke="#FFFFFF" stroke-width="3"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; flex: 1;">
        <span style="font-size: 17px; font-weight: bold; color: #0F172A;">Payment successful</span>
        <span style="font-size: 14px; color: #64748B;">Your order #A1029 has been confirmed.</span>
      </div>
    </div>
  </body>
</html>
