<!DOCTYPE html>
<html>
  <head>
    <title>Opacity Fade</title>
    <style>
      @keyframes fade {
        0%   { opacity: 0; }
        100% { opacity: 1; }
      }
    </style>
  </head>
  <body style="width: 240px; height: 160px; background-color: #0F172A;">
    <div id="dot"
         style="position: absolute; left: 88px; top: 56px;
                width: 64px; height: 64px; border-radius: 32px;
                background-color: #38BDF8;
                animation: fade 1.5s linear infinite;"></div>
  </body>
</html>
