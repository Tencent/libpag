<!DOCTYPE html>
<html>
  <head>
    <title>Skeleton Shimmer Loader</title>
    <style>
      /* Classic skeleton placeholder: gray blocks under a single
         light gradient strip swept across via translateX. The card
         clips the strip with overflow: hidden. */
      @keyframes shimmer {
        0%   { transform: translateX(-180px); }
        100% { transform: translateX(420px); }
      }
      .block { background-color: #E2E8F0; border-radius: 8px; }
    </style>
  </head>
  <body style="width: 480px; height: 260px; display: flex; flex-direction: column;
               align-items: center; justify-content: center;
               background-color: #F1F5F9;">
    <div style="width: 380px; height: 150px; padding: 24px; border-radius: 18px;
                overflow: hidden; background-color: #FFFFFF;
                box-shadow: 0 14px 30px #94A3B826;
                display: flex; flex-direction: row; gap: 18px;">
      <div class="block" style="width: 64px; height: 64px; border-radius: 9999px;"></div>
      <div style="display: flex; flex-direction: column; gap: 14px; flex: 1;">
        <div class="block" style="width: 100%; height: 16px;"></div>
        <div class="block" style="width: 80%; height: 14px;"></div>
        <div class="block" style="width: 60%; height: 14px;"></div>
        <div class="block" style="width: 90%; height: 14px;"></div>
      </div>
      <div style="position: absolute; top: 0px; left: 0px; width: 120px; height: 150px;
                  background-image: linear-gradient(90deg, #FFFFFF00, #FFFFFFCC, #FFFFFF00);
                  animation: shimmer 1.6s linear infinite;"></div>
    </div>
  </body>
</html>
