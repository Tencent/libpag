<!DOCTYPE html>
<html>
  <head>
    <title>Text Color</title>
    <style>
      @keyframes textHue {
        0%   { color: #FACC15; }
        100% { color: #22D3EE; }
      }
    </style>
  </head>
  <body style="width: 320px; height: 120px; background-color: #0B1120; font-family: Arial;">
    <h1 id="title"
        style="position: absolute; left: 24px; top: 36px;
               font-size: 40px; font-weight: bold; color: #FACC15;
               animation: textHue 2s linear infinite;">PAGX</h1>
  </body>
</html>
