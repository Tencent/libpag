<!DOCTYPE html>
<html>
  <head>
    <title>Direction - reverse</title>
    <style>
      @keyframes drop {
        0%   { transform: translateY(0px); opacity: 1; }
        100% { transform: translateY(120px); opacity: 0; }
      }
    </style>
  </head>
  <body style="width: 160px; height: 200px; background-color: #1E293B;">
    <div id="rise"
         style="position: absolute; left: 56px; top: 16px;
                width: 48px; height: 48px; border-radius: 24px;
                background-color: #2DD4BF;
                animation: drop 1.5s linear infinite reverse;"></div>
  </body>
</html>
