<!DOCTYPE html>
<html>
  <head>
    <title>Duration in milliseconds</title>
    <style>
      @keyframes flashColor {
        0%   { background-color: #22C55E; }
        100% { background-color: #EAB308; }
      }
    </style>
  </head>
  <body style="width: 200px; height: 120px; background-color: #052E16;">
    <div id="chip"
         style="position: absolute; left: 50px; top: 36px;
                width: 100px; height: 48px; border-radius: 24px;
                background-color: #22C55E;
                animation: flashColor 800ms linear infinite alternate;"></div>
  </body>
</html>
