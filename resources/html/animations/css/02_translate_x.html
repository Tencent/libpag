<!DOCTYPE html>
<html>
  <head>
    <title>Translate X</title>
    <style>
      @keyframes slideX {
        0%   { transform: translateX(0px); }
        100% { transform: translateX(160px); }
      }
    </style>
  </head>
  <body style="width: 280px; height: 120px; background-color: #1E1B4B;">
    <div id="box"
         style="position: absolute; left: 16px; top: 36px;
                width: 48px; height: 48px; border-radius: 8px;
                background-color: #A78BFA;
                animation: slideX 2s linear infinite;"></div>
  </body>
</html>
