<!DOCTYPE html>
<html>
  <head>
    <title>Iteration - infinite loop</title>
    <style>
      @keyframes spinAlpha {
        0%   { opacity: 1; }
        50%  { opacity: 0.2; }
        100% { opacity: 1; }
      }
    </style>
  </head>
  <body style="width: 200px; height: 160px; background-color: #0C0A09;">
    <div id="pulse"
         style="position: absolute; left: 60px; top: 40px;
                width: 80px; height: 80px; border-radius: 40px;
                background-color: #FB7185;
                animation: spinAlpha 1.6s ease-in-out infinite;"></div>
  </body>
</html>
