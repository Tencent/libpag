<!DOCTYPE html>
<html>
  <head>
    <title>Live Price Ticker</title>
    <style>
      /* Finance ticker: each change badge bobs (translateY) while its
         fill pulses through the color channel — green for gains,
         red for losses. */
      @keyframes upPulse {
        0%   { transform: translateY(0px); background-color: #16A34A; }
        50%  { transform: translateY(-5px); background-color: #22C55E; }
        100% { transform: translateY(0px); background-color: #16A34A; }
      }
      @keyframes downPulse {
        0%   { transform: translateY(0px); background-color: #DC2626; }
        50%  { transform: translateY(5px); background-color: #EF4444; }
        100% { transform: translateY(0px); background-color: #DC2626; }
      }
      .row {
        display: flex; flex-direction: row; align-items: center; gap: 16px;
        width: 380px; padding: 14px 18px; border-radius: 14px;
        background-color: #1E293B;
      }
      .sym { font-size: 17px; font-weight: bold; color: #F8FAFC; flex: 1; }
      .price { font-size: 16px; color: #CBD5E1; }
      .badge {
        display: flex; flex-direction: row; align-items: center; gap: 6px;
        padding: 6px 12px; border-radius: 9999px;
      }
      .chg { font-size: 13px; font-weight: bold; color: #FFFFFF; }
    </style>
  </head>
  <body style="width: 480px; height: 320px; display: flex; flex-direction: column;
               align-items: center; justify-content: center; gap: 14px;
               background-image: linear-gradient(135deg, #0B1120, #111827); font-family: Arial;">

    <div class="row">
      <span class="sym">AAPL</span>
      <span class="price">$214.30</span>
      <div class="badge" style="background-color: #16A34A; animation: upPulse 1.6s ease-in-out infinite;">
        <svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 4l8 10h-6v6h-4v-6H4z" fill="#FFFFFF"/></svg>
        <span class="chg">+2.4%</span>
      </div>
    </div>

    <div class="row">
      <span class="sym">TSLA</span>
      <span class="price">$176.85</span>
      <div class="badge" style="background-color: #DC2626; animation: downPulse 1.6s ease-in-out infinite; animation-delay: 0.3s;">
        <svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 20l-8-10h6V4h4v6h6z" fill="#FFFFFF"/></svg>
        <span class="chg">-1.1%</span>
      </div>
    </div>

    <div class="row">
      <span class="sym">NVDA</span>
      <span class="price">$1208.40</span>
      <div class="badge" style="background-color: #16A34A; animation: upPulse 1.6s ease-in-out infinite; animation-delay: 0.6s;">
        <svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 4l8 10h-6v6h-4v-6H4z" fill="#FFFFFF"/></svg>
        <span class="chg">+5.7%</span>
      </div>
    </div>
  </body>
</html>
