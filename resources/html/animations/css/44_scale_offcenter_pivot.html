<!DOCTYPE html>
<html>
  <head>
    <title>Scale Off-Center Pivot</title>
    <!--
      Scaling about the bottom-right corner (100% 100%) instead of the box centre. Baked into the
      keyframes, the pivot translation differs per frame (T(c) * S(s) * T(-c)), so the badge also
      slides while it grows. An explicit pivot keeps that corner pinned at every sample.
    -->
    <style>
      @keyframes breathe {
        0%   { transform: scale(0.4); }
        50%  { transform: scale(1.2); }
        100% { transform: scale(0.4); }
      }
    </style>
  </head>
  <body style="width: 240px; height: 160px; background-color: #0F172A;">
    <div id="badge"
         style="position: absolute; left: 90px; top: 50px;
                width: 60px; height: 60px; border-radius: 12px;
                background-color: #38BDF8;
                transform-origin: 100% 100%;
                animation: breathe 2s ease-in-out infinite;"></div>
  </body>
</html>
