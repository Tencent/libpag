<!DOCTYPE html>
<html>
  <head>
    <title>Dropdown Menu</title>
    <style>
      /* Dropdown reveal: menu rows cascade in with translateY +
         opacity, each offset by animation-delay; alternate replays
         the open/close cycle. */
      @keyframes itemIn {
        0%   { opacity: 0; transform: translateY(-12px); }
        100% { opacity: 1; transform: translateY(0px); }
      }
      .item {
        display: flex; flex-direction: row; align-items: center; gap: 14px;
        padding: 12px 16px; border-radius: 10px; background-color: #FFFFFF;
      }
      .ic { display: flex; align-items: center; justify-content: center;
            width: 30px; height: 30px; border-radius: 8px; }
      .txt { font-size: 15px; font-weight: bold; color: #1E293B; flex: 1; }
    </style>
  </head>
  <body style="width: 420px; height: 380px; display: flex; flex-direction: column;
               align-items: center; justify-content: center;
               background-color: #E2E8F0; font-family: Arial;">
    <div style="display: flex; flex-direction: column; gap: 8px; width: 280px;
                padding: 14px; border-radius: 16px; background-color: #FFFFFF;
                box-shadow: 0 20px 44px #47556933;">
      <div style="display: flex; flex-direction: row; align-items: center; gap: 12px;
                  padding: 6px 8px 12px 8px;">
        <div class="ic" style="background-image: linear-gradient(135deg, #6366F1, #8B5CF6);">
          <svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="#FFFFFF"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6z" fill="#FFFFFF"/></svg>
        </div>
        <span style="font-size: 16px; font-weight: bold; color: #0F172A; flex: 1;">Jordan Lee</span>
        <svg width="16" height="16" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/></svg>
      </div>

      <div class="item" style="animation: itemIn 1.6s ease-out infinite alternate; animation-delay: 0s;">
        <div class="ic" style="background-color: #DBEAFE;"><svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="#3B82F6"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6z" fill="#3B82F6"/></svg></div>
        <span class="txt">Profile</span>
      </div>
      <div class="item" style="animation: itemIn 1.6s ease-out infinite alternate; animation-delay: 0.12s;">
        <div class="ic" style="background-color: #E0E7FF;"><svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="#6366F1" stroke-width="2"/><circle cx="12" cy="12" r="8" fill="none" stroke="#6366F1" stroke-width="2"/></svg></div>
        <span class="txt">Settings</span>
      </div>
      <div class="item" style="animation: itemIn 1.6s ease-out infinite alternate; animation-delay: 0.24s;">
        <div class="ic" style="background-color: #DCFCE7;"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M3 7h18v10H3z" fill="none" stroke="#22C55E" stroke-width="2"/><path d="M3 11h18" stroke="#22C55E" stroke-width="2"/></svg></div>
        <span class="txt">Billing</span>
      </div>
      <div class="item" style="animation: itemIn 1.6s ease-out infinite alternate; animation-delay: 0.36s;">
        <div class="ic" style="background-color: #FEE2E2;"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M14 4h4v16h-4" fill="none" stroke="#EF4444" stroke-width="2"/><path d="M10 8l-4 4 4 4M6 12h9" fill="none" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/></svg></div>
        <span class="txt" style="color: #DC2626;">Sign out</span>
      </div>
    </div>
  </body>
</html>
