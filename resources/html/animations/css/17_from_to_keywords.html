<!DOCTYPE html>
<html>
  <head>
    <title>from / to keywords</title>
    <style>
      @keyframes grow {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0px); }
      }
    </style>
  </head>
  <body style="width: 220px; height: 140px; background-color: #052E16;">
    <div id="leaf"
         style="position: absolute; left: 70px; top: 40px;
                width: 80px; height: 60px; border-radius: 12px;
                background-color: #86EFAC;
                animation: grow 1.2s ease-out infinite;"></div>
  </body>
</html>
