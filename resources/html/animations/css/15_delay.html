<!DOCTYPE html>
<html>
  <head>
    <title>Animation delay</title>
    <style>
      @keyframes enter {
        0%   { opacity: 0; transform: translateY(30px); }
        100% { opacity: 1; transform: translateY(0px); }
      }
    </style>
  </head>
  <body style="width: 300px; height: 130px; background-color: #111827;">
    <div id="delayed"
         style="position: absolute; left: 40px; top: 41px;
                width: 220px; height: 48px; border-radius: 8px;
                background-color: #818CF8;
                animation: enter 0.9s ease-out 0.6s 1;"></div>
  </body>
</html>
