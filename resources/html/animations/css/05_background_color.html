<!DOCTYPE html>
<html>
  <head>
    <title>Background Color</title>
    <style>
      @keyframes bg {
        0%   { background-color: #EF4444; }
        100% { background-color: #3B82F6; }
      }
    </style>
  </head>
  <body style="width: 220px; height: 160px; background-color: #111827;">
    <div id="swatch"
         style="position: absolute; left: 30px; top: 30px;
                width: 160px; height: 100px; border-radius: 16px;
                background-color: #EF4444;
                animation: bg 2.4s linear infinite;"></div>
  </body>
</html>
