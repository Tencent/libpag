<!DOCTYPE html>
<html>
  <head>
    <title>Rotate3D Center Pivot</title>
    <!--
      3D-only case: a card flipping around its centre with `perspective()` in every keyframe (a CSS
      transform animation replaces the whole property). The default centre origin means the pivot
      adds nothing, so this isolates the 3D pipeline from the anchor work.
    -->
    <style>
      @keyframes flip {
        0%   { transform: perspective(600px) rotateY(0deg); }
        50%  { transform: perspective(600px) rotateY(180deg); }
        100% { transform: perspective(600px) rotateY(360deg); }
      }
    </style>
  </head>
  <body style="width: 240px; height: 160px; background-color: #0F172A;">
    <div id="card"
         style="position: absolute; left: 60px; top: 40px;
                width: 120px; height: 80px; border-radius: 12px;
                background-color: #38BDF8;
                animation: flip 3s linear infinite;">
      <div style="position: absolute; left: 24px; top: 24px;
                  width: 72px; height: 32px; border-radius: 8px;
                  background-color: #F472B6;"></div>
    </div>
  </body>
</html>
