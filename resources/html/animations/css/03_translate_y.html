<!DOCTYPE html>
<html>
  <head>
    <title>Translate Y</title>
    <style>
      @keyframes slideY {
        0%   { transform: translateY(0px); }
        100% { transform: translateY(120px); }
      }
    </style>
  </head>
  <body style="width: 160px; height: 220px; background-color: #052E16;">
    <div id="ball"
         style="position: absolute; left: 56px; top: 16px;
                width: 48px; height: 48px; border-radius: 24px;
                background-color: #4ADE80;
                animation: slideY 1.2s linear infinite;"></div>
  </body>
</html>
