<!DOCTYPE html>
<html>
  <head>
    <title>Scale Center Pivot</title>
    <style>
      @keyframes breathe {
        0%   { transform: scale(0.4); }
        50%  { transform: scale(1.2); }
        100% { transform: scale(0.4); }
      }
    </style>
  </head>
  <body style="width: 240px; height: 160px; background-color: #0F172A;">
    <div id="badge"
         style="position: absolute; left: 90px; top: 50px;
                width: 60px; height: 60px; border-radius: 30px;
                background-color: #38BDF8;
                animation: breathe 2s ease-in-out infinite;"></div>
  </body>
</html>
