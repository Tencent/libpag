<!DOCTYPE html>
<html>
  <head>
    <title>anime.js - backgroundColor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  </head>
  <body style="width: 220px; height: 160px; background-color: #111827; position: relative; margin: 0;">
    <div id="swatch"
         style="position: absolute; left: 30px; top: 30px;
                width: 160px; height: 100px; border-radius: 16px;
                background-color: #EF4444;"></div>
    <script>
      // backgroundColor -> color 通道
      anime({
        targets: "#swatch",
        backgroundColor: "#3B82F6",
        duration: 2400,
        easing: "linear",
        direction: "alternate",
        loop: true
      });
    </script>
  </body>
</html>
