<!DOCTYPE html>
<html>
  <head>
    <title>anime.js - text color</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  </head>
  <body style="width: 320px; height: 120px; background-color: #0B1120; position: relative; margin: 0; font-family: Arial;">
    <h1 id="title"
        style="position: absolute; left: 24px; top: 30px; margin: 0;
               font-size: 40px; font-weight: bold; color: #FACC15;">PAGX</h1>
    <script>
      // 文本 color -> color 通道
      anime({
        targets: "#title",
        color: ["#FACC15", "#22D3EE"],
        duration: 2000,
        easing: "linear",
        direction: "alternate",
        loop: true
      });
    </script>
  </body>
</html>
