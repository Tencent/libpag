<!DOCTYPE html>
<html>
  <head>
    <title>Anime.js Skeleton Shimmer</title>
  </head>
  <body style="width: 800px; height: 600px; background-color: #F1F5F9; font-family: Arial;">
    <div style="display: flex; flex-direction: column; gap: 20px; width: 100%; height: 100%; padding: 48px;">

      <div class="card" style="display: flex; flex-direction: row; gap: 18px; padding: 24px; border-radius: 18px; background-color: #FFFFFF; overflow: hidden; box-shadow: 0 8px 24px #0F172A14;">
        <div class="ph" style="width: 72px; height: 72px; border-radius: 36px; background-color: #E2E8F0;"></div>
        <div style="display: flex; flex-direction: column; gap: 12px; flex: 1;">
          <div class="ph" style="width: 60%; height: 16px; border-radius: 8px; background-color: #E2E8F0;"></div>
          <div class="ph" style="width: 90%; height: 12px; border-radius: 6px; background-color: #E2E8F0;"></div>
          <div class="ph" style="width: 80%; height: 12px; border-radius: 6px; background-color: #E2E8F0;"></div>
        </div>
        <div id="sweep-a" style="position: absolute; top: 0px; left: -200px; width: 200px; height: 120px; background-image: linear-gradient(90deg, #FFFFFF00, #FFFFFFCC, #FFFFFF00);"></div>
      </div>

      <div class="card" style="display: flex; flex-direction: column; gap: 16px; padding: 24px; border-radius: 18px; background-color: #FFFFFF; overflow: hidden; box-shadow: 0 8px 24px #0F172A14;">
        <div class="ph" style="width: 100%; height: 150px; border-radius: 12px; background-color: #E2E8F0;"></div>
        <div class="ph" style="width: 50%; height: 16px; border-radius: 8px; background-color: #E2E8F0;"></div>
        <div class="ph" style="width: 75%; height: 12px; border-radius: 6px; background-color: #E2E8F0;"></div>
        <div id="sweep-b" style="position: absolute; top: 0px; left: -240px; width: 240px; height: 320px; background-image: linear-gradient(90deg, #FFFFFF00, #FFFFFFCC, #FFFFFF00);"></div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script>
      // shimmer sweep: a soft highlight slides across the cards (constant speed => linear)
      anime({
        targets: '#sweep-a',
        translateX: [0, 900],
        duration: 1400,
        easing: 'linear',
        loop: true
      });
      anime({
        targets: '#sweep-b',
        translateX: [0, 940],
        duration: 1400,
        delay: 200,
        easing: 'linear',
        loop: true
      });

      // subtle breathing on the placeholders themselves
      anime({
        targets: '.ph',
        opacity: [
          { value: 0.55, duration: 700 },
          { value: 1, duration: 700 }
        ],
        delay: anime.stagger(60),
        easing: 'easeInOutSine',
        loop: true,
        direction: 'alternate'
      });
    </script>
  </body>
</html>
