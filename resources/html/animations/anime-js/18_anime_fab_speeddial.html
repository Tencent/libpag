<!DOCTYPE html>
<html>
  <head>
    <title>Anime.js FAB Speed Dial</title>
  </head>
  <body style="width: 800px; height: 600px; background-image: linear-gradient(135deg, #0EA5E9, #2563EB); font-family: Arial;">
    <div style="width: 100%; height: 100%;">

      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 100%;">
        <p id="caption" style="font-size: 24px; font-weight: bold; color: #FFFFFF; opacity: 0;">Speed Dial</p>
        <p id="sub" style="font-size: 14px; letter-spacing: 2px; color: #BAE6FD; opacity: 0;">radial action menu</p>
      </div>

      <!-- action children fan out from the FAB; absolute so they overlap the FAB origin -->
      <div class="fab-child" style="position: absolute; right: 56px; bottom: 56px; width: 52px; height: 52px; border-radius: 26px; background-color: #F472B6; box-shadow: 0 8px 20px #00000033; opacity: 0;"></div>
      <div class="fab-child" style="position: absolute; right: 56px; bottom: 56px; width: 52px; height: 52px; border-radius: 26px; background-color: #FBBF24; box-shadow: 0 8px 20px #00000033; opacity: 0;"></div>
      <div class="fab-child" style="position: absolute; right: 56px; bottom: 56px; width: 52px; height: 52px; border-radius: 26px; background-color: #34D399; box-shadow: 0 8px 20px #00000033; opacity: 0;"></div>
      <div class="fab-child" style="position: absolute; right: 56px; bottom: 56px; width: 52px; height: 52px; border-radius: 26px; background-color: #A855F7; box-shadow: 0 8px 20px #00000033; opacity: 0;"></div>

      <div id="fab" style="position: absolute; right: 48px; bottom: 48px; width: 68px; height: 68px; border-radius: 34px; background-color: #FFFFFF; box-shadow: 0 12px 28px #00000040;"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script>
      // fan-out destinations (relative to the FAB anchor): up, up-left arc
      const dests = [
        { x: 0, y: -96 },
        { x: -70, y: -70 },
        { x: -96, y: 0 },
        { x: -70, y: 70 }
      ];

      document.querySelectorAll('.fab-child').forEach((el, i) => {
        anime({
          targets: el,
          translateX: [0, dests[i].x],
          translateY: [0, dests[i].y],
          opacity: [0, 1],
          delay: 600 + i * 90,
          duration: 700,
          easing: 'cubicBezier(0.34, 1.56, 0.64, 1)',
          loop: true,
          direction: 'alternate'
        });
      });

      // breathing glow on the main FAB via background-color
      anime({
        targets: '#fab',
        backgroundColor: ['#FFFFFF', '#E0F2FE'],
        duration: 1200,
        easing: 'easeInOutSine',
        loop: true,
        direction: 'alternate'
      });

      anime({
        targets: '#caption',
        opacity: [0, 1],
        translateY: [-16, 0],
        duration: 700,
        easing: 'easeOutCubic'
      });
      anime({
        targets: '#sub',
        opacity: [0, 1],
        translateY: [-12, 0],
        delay: 200,
        duration: 700,
        easing: 'easeOutCubic'
      });
    </script>
  </body>
</html>
