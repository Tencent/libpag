<div class="overlay" id="overlay" hidden><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1"><div class="sheet-head"><h2 id="sheetTitle"></h2><button class="close-sheet" id="closeSheet" aria-label="关闭">×</button></div><div id="sheetBody"></div></section></div>
</main></div></div></div></div>
<script>
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const scene = $('#scene'), holder = $('#stageHolder');
  function fit() {
    const mobile = window.matchMedia('(max-width:520px)').matches;
    const w = mobile ? 464 : 638, h = mobile ? 1004 : 1080;
    const scale = mobile ? window.innerWidth/w : Math.min(window.innerWidth/w, window.innerHeight/h, 660/638);
    holder.style.width = `${w*scale}px`; holder.style.height = `${h*scale}px`;
    scene.style.transform = `scale(${scale})`;
  }
  fit(); window.addEventListener('resize', fit);
  const products = [
    {name:'莱大全水果捞', price:'9.5', image:document.querySelector('[data-product="0"] img').src},
    {name:'水果拼盘', price:'12.5', image:document.querySelector('[data-product="1"] img').src},
    {name:'酸奶水果捞', price:'15.9', image:document.querySelector('[data-product="2"] img').src}
  ];
  const merchants = [...document.querySelectorAll('.merchant')].map(el => ({name:el.querySelector('.merchant-name').textContent, eta:el.querySelector('.eta').textContent, image:el.querySelector('img').src}));
  const overlay = $('#overlay'), sheetBody = $('#sheetBody');
  let returnFocus = null, toastTimer;
  function toast(text) { clearTimeout(toastTimer); $('#toast').textContent=text; $('#toast').hidden=false; toastTimer=setTimeout(()=>$('#toast').hidden=true,2100); }
  function openSheet(title, content) { returnFocus=document.activeElement; $('#sheetTitle').textContent=title; sheetBody.replaceChildren(content); overlay.hidden=false; $('#closeSheet').focus(); }
  function closeSheet() { overlay.hidden=true; if(returnFocus?.isConnected) returnFocus.focus({preventScroll:true}); }
  function message(text) { const p=document.createElement('p'); p.textContent=text; return p; }
  function productDetail(index) {
    const p=products[index], box=document.createElement('div');
    const img=document.createElement('img'); img.className='detail-image'; img.src=p.image; img.alt=p.name;
    const price=document.createElement('div'); price.className='detail-price'; price.textContent=`¥${p.price}`;
    box.append(img,price,message('免配送费 · 到手价'),message('这是参考界面的交互演示，未接入真实商品与下单服务。'));
    openSheet(p.name,box);
  }
  function showProducts(title, query='') {
    const box=document.createElement('div');
    const list=products.map((p,i)=>({...p,i})).filter(p=>!query || p.name.includes(query) || /水果|果切|春天|蔬菜/.test(query));
    list.forEach(p=>{
      const row=document.createElement('button'); row.className='result';
      const img=document.createElement('img'); img.src=p.image; img.alt='';
      const info=document.createElement('div'), name=document.createElement('strong'), price=document.createElement('span');
      name.textContent=p.name; price.className='result-price'; price.textContent=`¥${p.price}`;
      info.append(name,price); row.append(img,info); row.addEventListener('click',()=>productDetail(p.i)); box.append(row);
    });
    if(!list.length) box.append(message('当前演示中没有匹配商品，试试搜索“水果”。'));
    openSheet(title,box);
  }
  function showMerchants() {
    const box=document.createElement('div');
    merchants.forEach((m,i)=>{const row=document.createElement('button');row.className='result';const img=document.createElement('img');img.src=m.image;img.alt='';const name=document.createElement('strong');name.textContent=`${m.name} · ${m.eta}`;row.append(img,name);row.onclick=()=>merchantDetail(i);box.append(row);});
    box.append(message('参考图标注共45个商家；此演示仅展示图中可见的4家。'));openSheet('附近商家',box);
  }
  function merchantDetail(index) { const m=merchants[index], box=document.createElement('div'), img=document.createElement('img');img.src=m.image;img.className='detail-image';img.alt=m.name;box.append(img,message(`预计 ${m.eta} 送达`),message('此为界面演示，未接入实时商家信息。'));openSheet(m.name,box); }
  document.querySelectorAll('[data-product]').forEach(b=>b.addEventListener('click',()=>productDetail(Number(b.dataset.product))));
  document.querySelectorAll('[data-merchant]').forEach(b=>b.addEventListener('click',()=>merchantDetail(Number(b.dataset.merchant))));
  document.querySelectorAll('[data-category]').forEach(b=>b.addEventListener('click',()=>{ const c=b.dataset.category;if(c==='水果/果切')showProducts(c);else if(c==='大型超市')showMerchants();else openSheet(c,message('参考图未提供该分类的商品明细，此处仅演示分类入口。')); }));
  $('#searchForm').addEventListener('submit',e=>{e.preventDefault();const q=$('#searchInput').value.trim();showProducts(q?`搜索：${q}`:'春天必吃水果',q);});
  $('#allMerchants').addEventListener('click',showMerchants);
  $('#moreButton').addEventListener('click',()=>openSheet('真牛逼便利店',message('24h营业 · 30min送达 · 啥都有。本页面为截图还原的本地交互演示。')));
  $('#locationButton').addEventListener('click',()=>{
    const box=document.createElement('form'),input=document.createElement('input'),button=document.createElement('button');
    input.className='address-input';input.value=$('#addressText').textContent;input.required=true;input.maxLength=22;input.setAttribute('aria-label','配送地址');
    button.className='primary';button.textContent='保存地址';button.type='submit';
    box.append(input,button);box.addEventListener('submit',e=>{e.preventDefault();const value=input.value.trim();if(!value)return;$('#addressText').textContent=value;$('#locationButton').setAttribute('aria-label',`配送地址：${value}`);closeSheet();toast('地址已更新（仅本次演示）');});openSheet('配送地址',box);
  });
  document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{const name=b.dataset.nav;if(name==='首页'){closeSheet();return;}openSheet(name,message(`这是“${name}”入口的界面演示，参考图未提供对应页面，未接入账号、订单或购物服务。`));}));
  $('#closeSheet').addEventListener('click',closeSheet);overlay.addEventListener('click',e=>{if(e.target===overlay)closeSheet();});
  document.addEventListener('keydown',e=>{
    if(overlay.hidden)return;
    if(e.key==='Escape'){closeSheet();return;}
    if(e.key==='Tab'){const items=[...overlay.querySelectorAll('button,input,[tabindex="0"]')].filter(el=>!el.disabled);const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
  });
})();
</script>
